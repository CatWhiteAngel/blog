# QSL 卡片收发登记
# 每条记录只有 call 和 sent、received 是必填，其余可留空
#
# 字段说明：
#   call           呼号
#   sent           我是否已发出卡片（true / false）
#   sent_date      发出日期（可选，格式为 yyyy-mm-dd）
#   received       我是否已收到对方的卡（true / false）
#   received_date  收到日期（可选，格式为 yyyy-mm-dd）
#   note           备注：确认方式、eyeball QSO 场合等自由文本（可选）

